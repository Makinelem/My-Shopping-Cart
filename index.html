<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Shopping Cart</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #38bdf8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 20px;
      font-size: 14px;
      min-height: 100dvh;
    }

    .hidden {
      display: none !important;
    }

    /* ================= TELA DE LOGIN / CADASTRO ================= */
    .auth-screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .auth-header h1 {
      font-size: 20px;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    .auth-header p {
      font-size: 12px;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f8fafc;
      color: var(--text);
      line-height: 20px;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
    }

    .btn {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:active {
      opacity: 0.85;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      margin-top: 6px;
    }

    .btn-link {
      background: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      height: auto;
      padding: 6px;
      text-decoration: underline;
    }

    .error-text {
      color: var(--danger);
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
      font-weight: 600;
    }

    /* ================= MODAIS (ESQUECI SENHA & LISTAS SALVAS) ================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 2000;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      max-height: 85dvh;
      overflow-y: auto;
      background: var(--card);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
    }

    .modal-header h3 {
      font-size: 16px;
      color: var(--primary-dark);
    }

    .btn-close-modal {
      background: none;
      border: none;
      font-size: 20px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      line-height: 20px;
    }

    .modal-box p {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    /* Área de Salvar & Listar Listas */
    .save-list-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .save-list-row input {
      height: 36px;
      font-size: 14px;
    }

    .btn-save-list {
      width: auto;
      height: 36px;
      padding: 0 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn-new-blank {
      width: 100%;
      height: 34px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px dashed var(--primary);
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .saved-lists-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .saved-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }

    .saved-list-info {
      flex: 1;
      overflow: hidden;
      padding-right: 8px;
    }

    .saved-list-name {
      font-weight: 700;
      font-size: 13.5px;
      color: var(--text);
